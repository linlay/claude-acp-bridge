listenAddr: 127.0.0.1:3210
authToken: ""
defaultBackend: claude-code

backends:
  - key: claude-code
    command: ./claude-cli-acp
    args:
      - -claude
      - claude
    defaultCwd: /Users/linlay/Project/zenmind
    idleTimeoutMs: 1800000
    env: {}
    capabilities:
      fs:
        readTextFile: true
        writeTextFile: true
      terminal: true

  - key: codex
    command: codex-acp
    args: []
    defaultCwd: /Users/linlay/Project/zenmind
    idleTimeoutMs: 1800000
    env: {}
    capabilities:
      fs:
        readTextFile: true
        writeTextFile: false
      terminal: false
